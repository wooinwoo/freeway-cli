{
  "openapi": "3.1.0",
  "info": {
    "title": "Freeway Local Gateway API",
    "version": "1.0.0",
    "description": "Native authenticated loopback HTTP contract. The common Go backend is a separate deliverable. Clients own no provider policy or persistent user database. JSON and accumulated text responses are limited to 8 MiB.",
    "license": {
      "name": "MIT",
      "identifier": "MIT"
    }
  },
  "servers": [
    {
      "url": "http://127.0.0.1:4141"
    }
  ],
  "security": [
    {
      "ClientKey": []
    }
  ],
  "paths": {
    "/v1/models": {
      "get": {
        "operationId": "listModels",
        "description": "Return explicit free and ready flags. Include free/auto only when eligible. The client excludes paid, unavailable, and unknown-status entries.",
        "responses": {
          "200": {
            "description": "Models visible to this user",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "data"
                  ],
                  "properties": {
                    "data": {
                      "type": "array",
                      "items": {
                        "$ref": "#/components/schemas/Model"
                      }
                    }
                  }
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/Error"
          }
        }
      }
    },
    "/v1/chat/completions": {
      "post": {
        "operationId": "streamCompletion",
        "description": "Return OpenAI-shaped SSE data events with actual model/provider, optional usage, and final data: [DONE]. Error events use the Error envelope. The backend owns free-only routing, fallback and quota accounting. Never switch routes after emitting content. HTTP disconnect cancels execution. Conversation saves must remain available while streaming. File attachments arrive as reference text in message content, without UI metadata.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "model",
                  "messages",
                  "stream"
                ],
                "properties": {
                  "model": {
                    "type": "string"
                  },
                  "messages": {
                    "type": "array",
                    "minItems": 1,
                    "maxItems": 200,
                    "items": {
                      "type": "object",
                      "required": [
                        "role",
                        "content"
                      ],
                      "properties": {
                        "role": {
                          "enum": [
                            "system",
                            "developer",
                            "user",
                            "assistant"
                          ]
                        },
                        "content": {
                          "type": "string"
                        }
                      },
                      "additionalProperties": false
                    }
                  },
                  "stream": {
                    "const": true
                  },
                  "max_tokens": {
                    "type": "integer",
                    "minimum": 1,
                    "maximum": 32768
                  },
                  "temperature": {
                    "type": "number",
                    "minimum": 0,
                    "maximum": 2
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Text event stream",
            "content": {
              "text/event-stream": {
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/Error"
          }
        }
      }
    },
    "/v1/conversations": {
      "get": {
        "operationId": "listConversations",
        "responses": {
          "200": {
            "description": "Saved metadata, newest first",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "data"
                  ],
                  "properties": {
                    "data": {
                      "type": "array",
                      "items": {
                        "$ref": "#/components/schemas/ConversationSummary"
                      }
                    }
                  }
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/Error"
          }
        }
      },
      "post": {
        "operationId": "createConversation",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/Conversation"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Generated ID and revision 1 after successful persistence",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Conversation"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/Error"
          }
        }
      }
    },
    "/v1/conversations/{id}": {
      "parameters": [
        {
          "name": "id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string",
            "pattern": "^[A-Za-z0-9_-]+$"
          }
        }
      ],
      "get": {
        "operationId": "getConversation",
        "description": "Interrupted assistant messages are recovered as stopped, never done.",
        "responses": {
          "200": {
            "description": "Saved conversation",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Conversation"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/Error"
          }
        }
      },
      "put": {
        "operationId": "updateConversation",
        "description": "Atomically compare revision and persist client state. Reject stale revisions with 409 and code chat_conflict. Increment revision only after persistence succeeds; preserve original data on failure. Explicit empty arrays clear messages, attachments and queue. Null clears stash. Enforce the same single-writer/revision invariant across processes.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/Conversation"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Persisted state with incremented revision",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Conversation"
                }
              }
            }
          },
          "409": {
            "$ref": "#/components/responses/Error"
          },
          "default": {
            "$ref": "#/components/responses/Error"
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "ClientKey": {
        "type": "http",
        "scheme": "bearer"
      }
    },
    "schemas": {
      "Error": {
        "type": "object",
        "required": [
          "error"
        ],
        "properties": {
          "error": {
            "type": "object",
            "required": [
              "message",
              "code"
            ],
            "properties": {
              "message": {
                "type": "string"
              },
              "code": {
                "type": "string"
              },
              "status": {
                "type": "integer"
              },
              "retryAfter": {
                "type": "integer",
                "minimum": 0
              }
            }
          }
        }
      },
      "Model": {
        "type": "object",
        "required": [
          "id",
          "name",
          "free",
          "ready"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "detail": {
            "type": "string"
          },
          "free": {
            "type": "boolean"
          },
          "ready": {
            "type": "boolean"
          }
        }
      },
      "Attachment": {
        "type": "object",
        "required": [
          "path",
          "content"
        ],
        "properties": {
          "path": {
            "type": "string",
            "maxLength": 1000
          },
          "content": {
            "type": "string",
            "maxLength": 200000
          }
        }
      },
      "PendingPrompt": {
        "type": "object",
        "required": [
          "text"
        ],
        "properties": {
          "text": {
            "type": "string",
            "maxLength": 150000
          },
          "files": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Attachment"
            },
            "maxItems": 5
          }
        }
      },
      "Message": {
        "type": "object",
        "required": [
          "id",
          "role",
          "content",
          "status"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "role": {
            "enum": [
              "user",
              "assistant"
            ]
          },
          "content": {
            "type": "string",
            "maxLength": 300000
          },
          "status": {
            "enum": [
              "done",
              "streaming",
              "stopped",
              "error"
            ]
          },
          "model": {
            "type": "string"
          },
          "error": {
            "type": "string"
          },
          "files": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Attachment"
            },
            "maxItems": 5
          }
        }
      },
      "Conversation": {
        "type": "object",
        "required": [
          "title",
          "model",
          "settings",
          "messages",
          "draft",
          "draftFiles",
          "queued",
          "stash"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "revision": {
            "type": "integer",
            "minimum": 1
          },
          "title": {
            "type": "string",
            "maxLength": 120
          },
          "model": {
            "type": "string"
          },
          "systemPrompt": {
            "type": "string",
            "maxLength": 20000
          },
          "workspace": {
            "type": "string"
          },
          "settings": {
            "type": "object",
            "required": [
              "maxTokens",
              "temperature"
            ],
            "properties": {
              "maxTokens": {
                "type": "integer",
                "minimum": 1,
                "maximum": 32768
              },
              "temperature": {
                "type": "number",
                "minimum": 0,
                "maximum": 2
              }
            }
          },
          "messages": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Message"
            },
            "maxItems": 198
          },
          "draft": {
            "type": "string",
            "maxLength": 150000
          },
          "draftFiles": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Attachment"
            },
            "maxItems": 5
          },
          "queued": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/PendingPrompt"
            },
            "maxItems": 20
          },
          "stash": {
            "anyOf": [
              {
                "$ref": "#/components/schemas/PendingPrompt"
              },
              {
                "type": "null"
              }
            ]
          }
        }
      },
      "ConversationSummary": {
        "type": "object",
        "required": [
          "id",
          "title",
          "updatedAt",
          "messageCount"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "title": {
            "type": "string"
          },
          "model": {
            "type": "string"
          },
          "updatedAt": {
            "type": "string",
            "format": "date-time"
          },
          "messageCount": {
            "type": "integer",
            "minimum": 0
          },
          "preview": {
            "type": "string"
          },
          "workspace": {
            "type": "string"
          },
          "hasDraft": {
            "type": "boolean"
          },
          "queuedCount": {
            "type": "integer",
            "minimum": 0
          }
        }
      }
    },
    "responses": {
      "Error": {
        "description": "Structured failure, never containing credentials",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      }
    }
  }
}
