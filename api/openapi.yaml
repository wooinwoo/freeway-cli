{
  "openapi": "3.1.0",
  "info": {
    "title": "Freeway Local Gateway API",
    "version": "1.0.0",
    "description": "Native authenticated loopback HTTP contract. Clients own no provider policy or persistent user database. JSON and accumulated text responses are limited to 8 MiB.",
    "license": {
      "name": "MIT",
      "identifier": "MIT"
    }
  },
  "servers": [
    {
      "url": "http://127.0.0.1:4141"
    }
  ],
  "security": [
    {
      "ClientKey": []
    }
  ],
  "paths": {
    "/v1/status": {
      "get": {
        "operationId": "gatewayStatus",
        "responses": {
          "204": {
            "description": "The gateway is ready.",
            "headers": {
              "X-Freeway-API": {
                "schema": {"type": "string", "const": "1"}
              },
              "X-Freeway-Features": {
                "description": "Comma-separated features available to this client. Includes idempotent-saves, prompt-history, context-selection for explicit conversation context settings, context-file-selection for individual attachment exclusions, history-pages for conversation paging and scoped prompt history, and opencode when enabled for this key.",
                "schema": {"type": "string"}
              }
            }
          },
          "default": {"$ref": "#/components/responses/Error"}
        }
      }
    },
    "/v1/prompts": {
      "get": {
        "operationId": "listRecentPrompts",
        "description": "Return recent user prompts in chronological order. Responses may include healthy results alongside an incomplete flag. Assistant replies and attachment contents are excluded.",
        "parameters": [
          {"name": "workspace", "in": "query", "description": "Limit prompts to sessions saved in this project path. Omit to include all projects.", "schema": {"type": "string", "maxLength": 4096}}
        ],
        "responses": {
          "200": {
            "description": "Recent prompt text and partial-read status",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": ["data", "incomplete"],
                  "properties": {
                    "data": {"type": "array", "items": {"type": "string"}},
                    "incomplete": {"type": "boolean"}
                  }
                }
              }
            }
          },
          "default": {"$ref": "#/components/responses/Error"}
        }
      }
    },
    "/v1/models": {
      "get": {
        "operationId": "listModels",
        "description": "Return explicit free and ready flags. Include free/auto only when eligible. The client excludes paid, unavailable, and unknown-status entries.",
        "responses": {
          "200": {
            "description": "Models visible to this user",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "data"
                  ],
                  "properties": {
                    "data": {
                      "type": "array",
                      "items": {
                        "$ref": "#/components/schemas/Model"
                      }
                    }
                  }
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/Error"
          }
        }
      }
    },
    "/v1/chat/completions": {
      "post": {
        "operationId": "streamCompletion",
        "description": "Return OpenAI-shaped SSE data events with actual model/provider, optional usage, and final data: [DONE]. Error events use the Error envelope. The backend owns free-only routing, fallback and quota accounting. Never switch routes after emitting content. HTTP disconnect cancels execution. Conversation saves must remain available while streaming. File attachments arrive as reference text in message content, without UI metadata.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "model",
                  "messages",
                  "stream"
                ],
                "properties": {
                  "model": {
                    "type": "string"
                  },
                  "messages": {
                    "type": "array",
                    "minItems": 1,
                    "maxItems": 200,
                    "items": {
                      "type": "object",
                      "required": [
                        "role",
                        "content"
                      ],
                      "properties": {
                        "role": {
                          "enum": [
                            "system",
                            "developer",
                            "user",
                            "assistant"
                          ]
                        },
                        "content": {
                          "type": "string"
                        }
                      },
                      "additionalProperties": false
                    }
                  },
                  "stream": {
                    "const": true
                  },
                  "max_tokens": {
                    "type": "integer",
                    "minimum": 1,
                    "maximum": 32768
                  },
                  "temperature": {
                    "type": "number",
                    "minimum": 0,
                    "maximum": 2
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Text event stream",
            "content": {
              "text/event-stream": {
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/Error"
          }
        }
      }
    },
    "/v1/conversations": {
      "get": {
        "operationId": "listConversations",
        "description": "Omit limit for the original complete list. Provide limit to enable paging, search, and project filtering.",
        "parameters": [
          {"name": "limit", "in": "query", "schema": {"type": "integer", "minimum": 1, "maximum": 100}},
          {"name": "workspace", "in": "query", "description": "Filter to this project path and older records without a workspace. Omit to include all projects.", "schema": {"type": "string", "maxLength": 4096}},
          {"name": "q", "in": "query", "description": "Find case-insensitive matches in ID, title, preview, or path. Lookup mode ranks exact ID, ID prefix, exact title, then partial title.", "schema": {"type": "string", "maxLength": 1024}},
          {"name": "mode", "in": "query", "description": "Lookup requires q. Latest finds one usable conversation and prefers the requested workspace over older records without one.", "schema": {"type": "string", "enum": ["lookup", "latest"]}},
          {"name": "cursor", "in": "query", "description": "Pass the previous response's nextCursor with the same filters. Latest mode does not take a cursor.", "schema": {"type": "string", "maxLength": 200}}
        ],
        "responses": {
          "200": {
            "description": "Saved metadata, newest first",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "data"
                  ],
                  "properties": {
                    "data": {
                      "type": "array",
                      "items": {
                        "$ref": "#/components/schemas/ConversationSummary"
                      }
                    },
                    "nextCursor": {"type": "string", "description": "Present when another page is available."}
                  }
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/Error"
          }
        }
      },
      "post": {
        "operationId": "createConversation",
        "description": "Reusing the same save key with the same body returns the original conversation ID and revision 1.",
        "parameters": [{"$ref": "#/components/parameters/SaveKey"}],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/Conversation"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Generated ID and revision 1 after successful persistence",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Conversation"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/Error"
          }
        }
      }
    },
    "/v1/conversations/{id}": {
      "parameters": [
        {
          "name": "id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string",
            "pattern": "^[A-Za-z0-9_-]+$"
          }
        }
      ],
      "get": {
        "operationId": "getConversation",
        "description": "Interrupted assistant messages are recovered as stopped. An unreadable conversation returns 422 with code chat_unreadable and its original file is preserved.",
        "responses": {
          "200": {
            "description": "Saved conversation",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Conversation"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/Error"
          }
        }
      },
      "put": {
        "operationId": "updateConversation",
        "description": "Atomically compare revision and persist client state. A retry of one of the four most recent keyed updates with the original body returns its committed revision. Stale revisions return 409 chat_conflict and reuse with a changed body returns 409 save_key_reused. Explicit empty arrays clear messages, attachments and queue. Null clears stash.",
        "parameters": [{"$ref": "#/components/parameters/SaveKey"}],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/Conversation"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Persisted state with incremented revision",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Conversation"
                }
              }
            }
          },
          "409": {
            "$ref": "#/components/responses/Error"
          },
          "default": {
            "$ref": "#/components/responses/Error"
          }
        }
      }
    }
  },
  "components": {
    "parameters": {
      "SaveKey": {
        "name": "Idempotency-Key",
        "in": "header",
        "description": "Optional unique key for a save operation. Reuse it with the original body when the response is lost.",
        "schema": {"type": "string", "pattern": "^[A-Za-z0-9_-]{16,64}$"}
      }
    },
    "securitySchemes": {
      "ClientKey": {
        "type": "http",
        "scheme": "bearer"
      }
    },
    "schemas": {
      "Error": {
        "type": "object",
        "required": [
          "error"
        ],
        "properties": {
          "error": {
            "type": "object",
            "required": [
              "message",
              "code"
            ],
            "properties": {
              "message": {
                "type": "string"
              },
              "code": {
                "type": "string"
              },
              "status": {
                "type": "integer"
              },
              "retryAfter": {
                "type": "integer",
                "minimum": 0
              },
              "maxOutputTokens": {
                "type": "integer",
                "minimum": 0,
                "description": "Locally estimated output allowance for this exact input when rejected with local_token_budget."
              }
            }
          }
        }
      },
      "Model": {
        "type": "object",
        "required": [
          "id",
          "name",
          "free",
          "ready"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "detail": {
            "type": "string"
          },
          "free": {
            "type": "boolean"
          },
          "ready": {
            "type": "boolean"
          },
          "localTokensRemaining": {
            "type": "integer",
            "minimum": 0,
            "description": "Estimated unreserved local token headroom. Input framing and output both consume it."
          }
        }
      },
      "Attachment": {
        "type": "object",
        "required": [
          "path",
          "content"
        ],
        "properties": {
          "path": {
            "type": "string",
            "maxLength": 1000
          },
          "content": {
            "type": "string",
            "maxLength": 200000
          }
        }
      },
      "PendingPrompt": {
        "type": "object",
        "required": [
          "text"
        ],
        "properties": {
          "text": {
            "type": "string",
            "maxLength": 150000
          },
          "files": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Attachment"
            },
            "maxItems": 5
          }
        }
      },
      "Message": {
        "type": "object",
        "required": [
          "id",
          "role",
          "content",
          "status"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "role": {
            "enum": [
              "user",
              "assistant"
            ]
          },
          "content": {
            "type": "string",
            "maxLength": 300000
          },
          "status": {
            "enum": [
              "done",
              "streaming",
              "stopped",
              "error"
            ]
          },
          "model": {
            "type": "string"
          },
          "error": {
            "type": "string"
          },
          "files": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Attachment"
            },
            "maxItems": 5
          }
        }
      },
      "Conversation": {
        "type": "object",
        "required": [
          "title",
          "model",
          "settings",
          "messages",
          "draft",
          "draftFiles",
          "queued",
          "stash"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "revision": {
            "type": "integer",
            "minimum": 1
          },
          "title": {
            "type": "string",
            "maxLength": 120
          },
          "model": {
            "type": "string"
          },
          "systemPrompt": {
            "type": "string",
            "maxLength": 20000
          },
          "context": {
            "type": "object",
            "description": "Client-side input selection for future requests. An omitted field on a new conversation uses the legacy defaults. An update to a conversation with explicit context must send its settings.",
            "required": ["recentTurns", "includePriorAttachments"],
            "properties": {
              "recentTurns": {"type": "integer", "minimum": -1, "maximum": 198, "description": "-1 includes all earlier turns and 0 excludes them."},
              "includePriorAttachments": {"type": "boolean"},
              "excludedPriorFiles": {
                "type": "array", "maxItems": 990, "uniqueItems": true,
                "items": {"type": "string", "minLength": 1, "maxLength": 1000},
                "description": "Stored paths to exclude from earlier messages. All earlier copies of a listed path are excluded. The current or retried question still includes its own attachments."
              }
            }
          },
          "workspace": {
            "type": "string"
          },
          "settings": {
            "type": "object",
            "required": [
              "maxTokens",
              "temperature"
            ],
            "properties": {
              "maxTokens": {
                "type": "integer",
                "minimum": 1,
                "maximum": 32768
              },
              "temperature": {
                "type": "number",
                "minimum": 0,
                "maximum": 2
              }
            }
          },
          "messages": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Message"
            },
            "maxItems": 198
          },
          "draft": {
            "type": "string",
            "maxLength": 150000
          },
          "draftFiles": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Attachment"
            },
            "maxItems": 5
          },
          "queued": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/PendingPrompt"
            },
            "maxItems": 20
          },
          "stash": {
            "anyOf": [
              {
                "$ref": "#/components/schemas/PendingPrompt"
              },
              {
                "type": "null"
              }
            ]
          }
        }
      },
      "ConversationSummary": {
        "type": "object",
        "required": [
          "id",
          "title",
          "updatedAt",
          "messageCount"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "title": {
            "type": "string"
          },
          "model": {
            "type": "string"
          },
          "updatedAt": {
            "anyOf": [{"type": "string", "format": "date-time"}, {"const": ""}],
            "description": "Empty when the metadata of an unreadable record cannot be recovered."
          },
          "messageCount": {
            "type": "integer",
            "minimum": 0
          },
          "preview": {
            "type": "string"
          },
          "workspace": {
            "type": "string"
          },
          "hasDraft": {
            "type": "boolean"
          },
          "queuedCount": {
            "type": "integer",
            "minimum": 0
          },
          "damaged": {
            "type": "boolean",
            "description": "True when the original conversation file is preserved but cannot be opened."
          }
        }
      }
    },
    "responses": {
      "Error": {
        "description": "Structured failure, never containing credentials",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      }
    }
  }
}
