0" y="680" text-anchor="middle" font-size="13" fill="#3c5d76">텍스트·도구·usage 이벤트</text><path d="M675,729 L225,729" fill="none" stroke="#60778e" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="420.0" y="703" width="60" height="21" rx="3" fill="white"/><text x="450.0" y="719" text-anchor="middle" font-size="13" fill="#3c5d76">정규화된 이벤트</text><path d="M225,768 L75,768" fill="none" stroke="#60778e" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="106.2" y="742" width="87.6" height="21" rx="3" fill="white"/><text x="150.0" y="758" text-anchor="middle" font-size="13" fill="#3c5d76">SSE 또는 최종 응답</text><path d="M225,807 L525,807" fill="none" stroke="#60778e" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="309.3" y="781" width="131.4" height="21" rx="3" fill="white"/><text x="375.0" y="797" text-anchor="middle" font-size="13" fill="#3c5d76">예약을 실제·추정 사용량으로 확정</text><rect x="12" y="826" width="876" height="29" rx="3" fill="#eaf2f7"/><text x="22" y="846" font-size="14" font-weight="700" fill="#294c64">사용자 취소 · 다음 후보 없이 현재 시도를 중단하고 예약을 정산</text><path d="M75,885 L225,885" fill="none" stroke="#60778e" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="120.0" y="859" width="60" height="21" rx="3" fill="white"/><text x="150.0" y="875" text-anchor="middle" font-size="13" fill="#3c5d76">취소</text><path d="M225,924 L675,924" fill="none" stroke="#60778e" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="420.0" y="898" width="60" height="21" rx="3" fill="white"/><text x="450.0" y="914" text-anchor="middle" font-size="13" fill="#3c5d76">현재 시도 중단</text><path d="M675,963 L825,963" fill="none" stroke="#60778e" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="677.0" y="937" width="146.0" height="21" rx="3" fill="white"/><text x="750.0" y="953" text-anchor="middle" font-size="13" fill="#3c5d76">요청 또는 자신이 만든 프로세스 중단</text><text x="25" y="1055" font-size="13" fill="#60778e">계획 조회는 읽기 전용 · 실행기가 선택 경로를 예약한 뒤 어댑터를 호출한다</text></g></svg>