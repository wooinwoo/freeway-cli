<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1000" viewBox="0 0 1180 1000"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#475569"/></marker></defs><rect width="1180" height="1000" fill="#f8fafc"/><g font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" fill="#142033"><text x="40" y="49" font-size="28" font-weight="700">세 프로젝트의 실제 요청 처리 구조</text><text x="40" y="80" font-size="15">2026-11-16 클론 소스 기준 · 일반 추론 흐름과 별도 실행 계층 구분</text><rect x="30" y="110" width="1120" height="263" rx="14" fill="white" stroke="#cbd5e1"/><text x="52" y="144" font-size="22" font-weight="700">LocalRouter · Rust / Tauri / React</text><rect x="52" y="170" width="250" height="87" rx="8" fill="#dcefee"/><text x="66" y="201" font-size="17" font-weight="600">앱·CLI·SDK</text><text x="66" y="230" font-size="13">OpenAI / Anthropic / Responses</text><path d="M305,213 H321" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><rect x="326" y="170" width="250" height="87" rx="8" fill="#dcefee"/><text x="340" y="201" font-size="17" font-weight="600">Axum + Client Auth</text><text x="340" y="230" font-size="13">lr-server · 요청 파이프라인</text><path d="M579,213 H595" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><rect x="600" y="170" width="250" height="87" rx="8" fill="#dcefee"/><text x="614" y="201" font-size="17" font-weight="600">Router + FreeTier</text><text x="614" y="230" font-size="13">무료 판정 · 후보 · backoff</text><path d="M853,213 H869" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><rect x="874" y="170" width="250" height="87" rx="8" fill="#dcefee"/><text x="888" y="201" font-size="17" font-weight="600">Provider HTTP</text><text x="888" y="230" font-size="13">Ollama · 외부 API · OAuth</text><text x="52" y="295" font-size="16">별도 CLI 실행 계층: lr-coding-agents + executor / direct subprocess</text><text x="52" y="331" font-size="14" fill="#475569">상태: settings.yaml · keychain · OAuth JSON · metrics.db · free_tier_state.json</text><rect x="30" y="395" width="1120" height="263" rx="14" fill="white" stroke="#cbd5e1"/><text x="52" y="429" font-size="22" font-weight="700">LiteLLM · Python Proxy + Rust Core</text><rect x="52" y="455" width="250" height="87" rx="8" fill="#e6eafa"/><text x="66" y="486" font-size="17" font-weight="600">앱·CLI·SDK</text><text x="66" y="515" font-size="13">FastAPI · user_api_key_auth</text><path d="M305,498 H321" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><rect x="326" y="455" width="250" height="87" rx="8" fill="#e6eafa"/><text x="340" y="486" font-size="17" font-weight="600">Python 요청 정책</text><text x="340" y="515" font-size="13">정규화 · hook · 권한·예산</text><path d="M579,498 H595" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><rect x="600" y="455" width="250" height="87" rx="8" fill="#e6eafa"/><text x="614" y="486" font-size="17" font-weight="600">Rust Router Core</text><text x="614" y="515" font-size="13">후보 · retry · fallback 상태</text><path d="M853,498 H869" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><rect x="874" y="455" width="250" height="87" rx="8" fill="#e6eafa"/><text x="888" y="486" font-size="17" font-weight="600">PythonHost + llms</text><text x="888" y="515" font-size="13">공급처 HTTP · 스트림 래퍼</text><text x="52" y="580" font-size="16">전략 일부는 Python Host로 위임 · 조건부 비동기 텍스트 이어쓰기</text><text x="52" y="616" font-size="14" fill="#475569">상태: registry/settings 스냅샷 · 메모리/선택적 Redis · 프록시 정책 저장</text><rect x="30" y="680" width="1120" height="263" rx="14" fill="white" stroke="#cbd5e1"/><text x="52" y="714" font-size="22" font-weight="700">CLIProxyAPI · Go</text><rect x="52" y="740" width="250" height="87" rx="8" fill="#f6e8d9"/><text x="66" y="771" font-size="17" font-weight="600">앱·CLI·SDK</text><text x="66" y="800" font-size="13">Gin · OpenAI / Claude / Gemini</text><path d="M305,783 H321" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><rect x="326" y="740" width="250" height="87" rx="8" fill="#f6e8d9"/><text x="340" y="771" font-size="17" font-weight="600">Handler + Translator</text><text x="340" y="800" font-size="13">요청·응답 형식 변환</text><path d="M579,783 H595" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><rect x="600" y="740" width="250" height="87" rx="8" fill="#f6e8d9"/><text x="614" y="771" font-size="17" font-weight="600">Auth Manager</text><text x="614" y="800" font-size="13">우선순위 · 회전 · affinity</text><path d="M853,783 H869" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><rect x="874" y="740" width="250" height="87" rx="8" fill="#f6e8d9"/><text x="888" y="771" font-size="17" font-weight="600">Provider Executor</text><text x="888" y="800" font-size="13">OAuth / API key → cloud HTTP</text><text x="52" y="865" font-size="16">공식 CLI 실행과 구분: OAuth 로그인 후 backend HTTP를 직접 호출</text><text x="52" y="901" font-size="14" fill="#475569">상태: auth 파일·token refresh · cooldown/quota signals · hot reload</text><text x="40" y="981" font-size="14" fill="#475569">전체 기능 목록이 아닌 핵심 호출 경로. 파일·라인 근거와 실패 경계는 프로젝트별 분석 문서 참조.</text></g></svg>